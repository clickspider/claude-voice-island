[project]
name = "claude-voice-island"
version = "1.0.0"
description = "Push-to-talk voice control for Claude Code, living in the MacBook notch"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Frey" }]
requires-python = ">=3.10"
keywords = ["claude", "voice", "macos", "notch", "speech", "mcp"]

[project.urls]
Homepage = "https://github.com/clickspider/claude-voice-island"
Issues = "https://github.com/clickspider/claude-voice-island/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import order
    "B",    # bugbear
    "BLE",  # every broad except has to justify itself
    "N",    # naming
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",
]
# Objective-C selector names break every Python naming rule and cannot be
# renamed, so each one carries its own noqa rather than the rule being switched
# off across the project.

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose: that is where the logic is.
"tests/*" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
