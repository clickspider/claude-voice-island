name: Release

# There is no binary to ship. The .app that scripts/make_app.sh builds hard-codes
# the checkout it was built from, so it cannot be handed to anyone else. A
# release here is a tag, a set of notes, and the promise that the tests passed on
# that exact commit.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v1.1.0
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: The tag and the version in the code have to agree
        id: version
        # Three places carry a version and they drift silently, which is how you
        # end up with a release whose About box says something else.
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PYPROJECT=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$VERSION" != "$PYPROJECT" ]; then
            echo "::error::tag $TAG says $VERSION, pyproject.toml says $PYPROJECT"
            exit 1
          fi
          for KEY in CFBundleVersion CFBundleShortVersionString; do
            if ! grep -q "<key>${KEY}</key><string>${VERSION}</string>" scripts/make_app.sh; then
              echo "::error::scripts/make_app.sh does not set ${KEY} to ${VERSION}"
              exit 1
            fi
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q

      - name: The setup script has to work on a clean machine
        # A release that cannot be installed from a fresh clone is not a release.
        run: |
          set -euo pipefail
          rm -rf venv
          ./scripts/setup.sh
          ./venv/bin/python -c "import voiceisland; print('imports from a clean setup')"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Generated notes need a starting point. On the first ever release
          # there is no previous tag, so let GitHub work it out itself.
          PREVIOUS=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes \
              --verify-tag --notes-start-tag "$PREVIOUS"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
