name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS only. Half of this is AppKit, so there is nothing meaningful to run
    # on another platform.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Import every module
        # The tests deliberately avoid the drawing code, so this is the check
        # that it still imports on each supported Python.
        run: |
          python -c "
          import voiceisland.ui.app, voiceisland.ui.pill, voiceisland.ui.menu
          import voiceisland.ui.notch, voiceisland.ui.symbols
          print('ui imports fine')
          "
