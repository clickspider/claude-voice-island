name: CI

on:
  push:
    branches: [main]
  pull_request:

# This job reads the checkout and nothing else. Said out loud so a pull request
# from a fork cannot borrow a token that can write to the repository.
permissions:
  contents: read

# Pushing three times to a branch used to start three sets of macOS runners and
# leave the first two running. Only the newest push is worth anything.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # macOS only. Half of this is AppKit, so there is nothing meaningful to run
    # on another platform.
    runs-on: macos-14
    # macOS minutes bill at ten times the Linux rate, so a hung job is not
    # something to find out about six hours later.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Actions are pinned to a commit, not a tag, because a tag can be moved to
      # point at different code after this file was reviewed. Dependabot moves
      # these; the comment says which version the commit is.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # Nothing here pushes, so the runner has no reason to keep a token
          # sitting in .git/config where a later step could read it.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Import every module
        # The tests deliberately avoid the drawing code, so this is the check
        # that it still imports on each supported Python.
        run: |
          python -c "
          import voiceisland.ui.app, voiceisland.ui.pill, voiceisland.ui.menu
          import voiceisland.ui.notch, voiceisland.ui.symbols
          print('ui imports fine')
          "
