name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday morning. The point of the schedule is that new rules get applied to
    # old code, which a push-only trigger never does on a quiet repository.
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: analyze
    # Python needs no compiler, so this does not have to pay for a macOS runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3.29.5
        with:
          languages: python
          # security-extended catches the things that matter here: the app
          # shells out to the Claude CLI and writes files under the home
          # directory, so command construction and path handling are the risk.
          queries: security-extended

      - uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3.29.5
        with:
          category: /language:python
